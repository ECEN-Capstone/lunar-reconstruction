   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #227b9d" x="88.4736" y="172.879256" transform="rotate(-0 88.4736 172.879256)">Overlapping views: estimate from imagery</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 208.853637)">Example: obs_044 → obs_047</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 226.8852)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 252.448325)">Match image features + use stereo 3D points.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 274.148325)">Fit a relative pose and test held-out features.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 291.9852)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 318.190356)">135 feature matches; 44 PnP inliers.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 339.248325)">11 held-out matches: median 0.49 px.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 360.948325)">Endpoint camera displacement ≈ 0.89 m.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ac376c" x="628.992" y="172.879256" transform="rotate(-0 628.992 172.879256)">No accepted registration: use a prior</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 208.853637)">Example: obs_033 → obs_034</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 226.8852)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 252.448325)">Associate images with MID 036 by timing.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 274.790356)">Assume turn 10° CCW, then drive 4 m.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 291.9852)"/>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 317.548325)">Fit height + tilt to shared terrain conditionally.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 339.248325)">Nominal fit: +0.409 m elevation adjustment.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(628.992 362.304575)">Actual horizontal motion remains unverified.</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213347" x="88.4736" y="476.9031" transform="rotate(-0 88.4736 476.9031)">Intermediate path: a model in both cases</text>
   </g>
   <g id="text_6">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 512.662325)">Registered endpoints use position/orientation interpolation. The mobility prior uses turn-then-drive.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 535.062325)">The video path is sampled at 33 poses; it is not recovered rover telemetry or real maneuver timing.</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #213347" transform="translate(88.4736 557.462325)">Generated video must have its own output poses checked before any terrain is accepted.</text>
   </g>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #213347" x="46.08" y="38.88" transform="rotate(-0 46.08 38.88)">Two sources of relative pose — different levels of evidence</text>
  </g>
  <g id="text_8">
   <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617181" x="46.08" y="71.28" transform="rotate(-0 46.08 71.28)">Camera calibration defines the viewing geometry. It does not supply the rover trajectory.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #617181" x="63.36" y="622.08" transform="rotate(-0 63.36 622.08)">Sources: registration_edges.json; video_bridge.py; video_pose.py; saved experiment metrics. No global lunar pose track is claimed.</text>
  </g>
